<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입장 발급 — 경제마을 캠프</title>
<link rel="stylesheet" href="common.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { color: var(--navy); font-size: 26px; margin: 6px 0 2px; }
  label { display: block; font-weight: 800; font-size: 14px; color: var(--navy); margin: 12px 0 4px; }
  .qrbox { text-align: center; padding: 14px 0 4px; }
  .qrbox .qr { width: 240px; height: 240px; margin: 0 auto; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; }
  .qrbox .qr svg { width: 100%; height: 100%; }
  .codeTxt { font-family: monospace; font-size: 22px; font-weight: 900; letter-spacing: 2px; margin-top: 8px; color: var(--navy); }
  .big { font-size: 20px; font-weight: 900; color: var(--navy); }
</style>
</head>
<body>
  <h1>🎒 입장 발급</h1>
  <p class="muted" id="campName">경제마을 캠프 — 개인 QR을 발급합니다</p>

  <div id="haveBox" class="hidden" style="background:#fff7e0;border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:700">
    <div id="haveTxt"></div>
    <div class="row" style="margin-top:8px;gap:8px">
      <button class="btn gold grow" style="margin:0" onclick="openSaved()">📂 내 통장 다시 열기</button>
      <button class="btn sm gray" style="margin:0" onclick="forgetSaved()">다른 학생이 발급할 때 — 저장 지우기</button>
  </div>
  </div>

  <div id="form">
    <div class="card">
      <label>입장 코드 (입구 안내판에 적힌 숫자 4자리)</label>
      <input id="pin" class="input" inputmode="numeric" maxlength="4" placeholder="예: 1234" style="letter-spacing:6px;font-weight:900">
      <label>이름</label>
      <input id="nm" class="input" placeholder="이름을 정확히 적어주세요">
      <div class="row">
        <div class="grow"><label>학년</label>
          <select id="gr" class="input"><option value="">선택</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option></select></div>
        <div style="width:110px"><label>반 (선택)</label><input id="cl" class="input" inputmode="numeric" placeholder="예: 2"></div>
      </div>
      <p id="msg" class="minus small" style="min-height:18px;margin:10px 0 0"></p>
      <button id="goBtn" class="btn blue" style="width:100%;margin-top:6px" onclick="submit()">✅ 발급하기</button>
      <p class="small muted" style="margin-bottom:0">발급 즉시 기본 크레딧이 지급되고 경제마을 주민이 됩니다. 최대 발행 한도 부족 또는 서버 혼잡 시 발급이 제한될 수 있습니다. 화면 v2.12.2. 발급된 화면(개인 QR)이 곧 통장이니 소중히 저장해 주세요.</p>
    </div>
  </div>

  <div id="done" class="hidden">
    <div class="card" style="text-align:center">
      <div style="font-size:44px">🎉</div>
      <div class="big" id="doneName"></div>
      <p class="muted small" id="doneInfo" style="margin-top:2px"></p>
      <div class="qrbox"><div class="qr" id="doneQr"></div></div>
      <div class="codeTxt" id="doneCode"></div>
      <p class="small" style="text-align:left" id="doneTip"></p>
      <a id="openMe" class="btn blue" style="display:block;text-decoration:none;color:#fff">내 통장 열기</a>
      <button class="btn ghost" style="width:100%;margin-top:10px" onclick="again()">이어서 다음 학생 발급</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let BUSY = false;

async function submit() {
  if (BUSY) return;
  $('msg').textContent = '';
  const p = { pin: $('pin').value.trim(), name: $('nm').value.trim(), grade: $('gr').value, cls: $('cl').value.trim() };
  if (!p.name) { $('msg').textContent = '이름을 입력하세요'; return; }
  BUSY = true; $('goBtn').disabled = true;
  const r = await Camp.api('join', p);
  BUSY = false; $('goBtn').disabled = false;
  if (!r.ok) { Camp.beep(false); $('msg').textContent = r.msg; return; }
  Camp.beep(true);
  showDone(r);
}
function showDone(r) {
  const url = Camp.cardUrl(r.code.slice(0, 6), r.code.slice(7));
  $('form').classList.add('hidden');
  $('done').classList.remove('hidden');
  $('doneName').textContent = r.name + ' 님, 환영합니다!';
  $('doneInfo').textContent = r.total + '번째 주민 · 기본 크레딧 ' + r.credit + ' 지급';
  $('doneQr').innerHTML = Camp.qrSvg(url, 5);
  $('doneCode').textContent = r.code;
  $('doneTip').innerHTML = '· 위 QR이 <b>내 개인 QR</b>이에요 — 스크린샷으로 저장하거나 이 페이지를 홈 화면에 추가하세요<br>· <b>내 통장 열기</b>를 누르면 잔액·거래 내역·한도를 볼 수 있습니다<br>· 부스에서는 이 QR을 내미세요 — <b>시작 스캔 → 체험 → 다시 스캔</b><br>· 실수로 화면을 나가도 괜찮아요 — 이 기기에 저장되어 <b>발급 화면·통장 로그인의 "내 통장 다시 열기"</b>로 돌아올 수 있어요';
  try { localStorage.setItem('campMyCode', r.code); localStorage.setItem('campMyName', r.name); } catch (e) {}
  $('openMe').href = url;
  window.scrollTo(0, 0);
}
function again() {
  $('done').classList.add('hidden');
  $('form').classList.remove('hidden');
  ['pin', 'nm', 'cl'].forEach(x => { $(x).value = ''; });
  $('gr').value = ''; $('msg').textContent = '';
  window.scrollTo(0, 0);
}
function savedCode() { try { return localStorage.getItem('campMyCode') || ''; } catch (e) { return ''; } }
function showHaveBanner() {
  const c = savedCode(); if (!c) return;
  let nm = ''; try { nm = localStorage.getItem('campMyName') || ''; } catch (e) {}
  $('haveTxt').textContent = (nm ? nm + ' 님' : '발급받은') + ' 통장이 이 기기에 저장되어 있어요 — 실수로 나가도 여기서 다시 열 수 있어요';
  $('haveBox').classList.remove('hidden');
}
function openSaved() { const c = savedCode(); if (c) location.href = Camp.cardUrl(c.slice(0, 6), c.slice(7)); }
function forgetSaved() { try { localStorage.removeItem('campMyCode'); localStorage.removeItem('campMyName'); } catch (e) {} $('haveBox').classList.add('hidden'); }
showHaveBanner();
Camp.api('ping', {}).then(r => { if (r.ok) $('campName').textContent = (r.camp || '경제마을 캠프') + ' — 개인 QR을 발급합니다'; });
</script>
</body>
</html>
